name: Bug report
description: Report incorrect behavior with a minimal reproduction.
type: Bug
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected skill or command and the smallest useful example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Include host, version, and EGM revision. Remove secrets and private data.
    validations:
      required: true
