name: Transition Merged Design PR Issue to PR Ready

on:
  # zizmor: ignore[dangerous-triggers] - Only inspects merged PR metadata/filenames and updates issue labels; never checks out or executes untrusted code.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  transition-design-pr:
    name: "Promote Linked Issue to pr-ready"
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # Required to inspect changed files on merged fork PRs
      issues: write # Required to swap design-ready -> pr-ready on linked issues
    steps:
      - name: "Transition linked issue labels from design-ready to pr-ready"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.merged) {
              return;
            }

            const { owner, repo } = context.repo;
            const rawBody = String(pr.body || "").replace(/<!--[\s\S]*?-->/g, "");
            const contributionType = rawBody.split(/^## Contribution Type[ \t]*\r?$/m)[1]?.split(/^##[ \t]+/m)[0] || "";
            const selectedTracks = [
              ...Array.from(contributionType.matchAll(/^[ \t]*Track:[ \t]*(.*)$/gmi), m => m[1].trim()),
              ...Array.from(contributionType.matchAll(/^[ \t]*(?:[-*][ \t]+)?\[[xX]\][ \t]*\*\*([^*\r\n]+)\*\*/gm), m => m[1].trim())
            ];
            const stage1Track = "Feature / Architectural Change -- Stage 1: Design Doc PR";
            const stage2Track = "Feature / Architectural Change -- Stage 2: Implementation PR";
            const isStage2 = selectedTracks.length === 1 && selectedTracks[0] === stage2Track;
            if (isStage2) {
              core.info("Skipping Stage 2 implementation PR.");
              return;
            }

            let files = [];
            try {
              files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: pr.number, per_page: 100 }
              );
            } catch (error) {
              core.warning(`Failed to list files for PR #${pr.number}: ${error.message}`);
            }

            const nonReadmeDesignFile = files.some(
              f => /^docs\/designs\/.+\.md$/i.test(f.filename) && !/^docs\/designs\/README\.md$/i.test(f.filename)
            );
            const allDesignDocs = files.length > 0 && files.every(f => /^docs\/designs\//i.test(f.filename));
            const isStage1Track = selectedTracks.length === 1 && selectedTracks[0] === stage1Track;

            if (!isStage1Track && !(nonReadmeDesignFile && allDesignDocs)) {
              core.info(`PR #${pr.number} is not a Stage 1 Design Doc PR; skipping label transition.`);
              return;
            }

            const issueRefRegex = /(?:refs?|references?|closes|fixes|resolves|issue)\s*[:#]?\s*(?:https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/|#)(\d+)/gi;
            const issueNumbers = [];
            const seen = new Set([pr.number]);
            for (const match of rawBody.matchAll(issueRefRegex)) {
              const num = Number(match[1]);
              if (Number.isInteger(num) && num > 0 && !seen.has(num)) {
                seen.add(num);
                issueNumbers.push(num);
              }
            }

            for (const issueNumber of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber
                }));
              } catch (error) {
                core.warning(`Could not inspect #${issueNumber}: ${error.message}`);
                continue;
              }
              if (issue.pull_request || issue.state !== "open") {
                continue;
              }
              const labels = new Set((issue.labels || []).map(l => String(l.name || "").toLowerCase()));
              if (!labels.has("pr-ready")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ["pr-ready"]
                });
              }
              if (labels.has("design-ready")) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: "design-ready"
                }).catch(error => {
                  if (error.status !== 404) throw error;
                });
              }
              core.info(`Updated issue #${issueNumber}: applied pr-ready and cleared design-ready.`);
            }
