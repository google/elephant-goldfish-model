# Run the offline unit tests described in TESTING.md, plus the site checks.
# They need no API keys or model dependencies.
name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site-validation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build without analytics
        run: |
          npm run build
          cp dist/index.html "$RUNNER_TEMP/egm-without-analytics.html"
        env:
          PUBLIC_GA_MEASUREMENT_ID: ''
      - name: Build with synthetic analytics ID
        run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-TEST
      - run: npm run check:docs
      - name: Verify browser consent ordering
        run: npm run test:browser -- "$RUNNER_TEMP/egm-without-analytics.html"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group lint
      - run: ruff check .
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install --group test
      - run: python -m pytest tests/unit
        shell: bash

  ci:
    name: CI
    if: ${{ always() }}
    needs: [unit, site-validation, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.NEEDS_JSON);
          for (const [name, job] of Object.entries(jobs)) {
            if (job.result !== 'success') {
              console.error(`${name}: ${job.result}`);
              process.exitCode = 1;
            }
          }
          JS
