# Run the Tier 1 unit tests (frontmatter schema, relative link integrity,
# scenario coverage, eval runner) described in TESTING.md. They are offline and
# need no API keys or model dependencies.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pytest==8.3.5 pyyaml==6.0.2
      - run: python -m pytest tests/unit
        shell: bash
