# Build and deploy the egm.dev landing site (site/) to GitHub Pages.
#
# Analytics and Cookie Notification Bar run only when window.location.hostname
# is 'egm.dev' and vars.PUBLIC_GA_MEASUREMENT_ID is configured on the repository,
# so forks and local builds never send data to Google hosts.
#
# First deploy (launch day): repository must be public, then Settings > Pages >
# Source = GitHub Actions, custom domain = egm.dev, Enforce HTTPS. Run this
# workflow once by hand with workflow_dispatch.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/*/assets/*.svg'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
