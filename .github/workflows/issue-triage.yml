name: Issue Triage Routing

on:
  issues:
    types: [opened, typed]

permissions: {}

jobs:
  triage-issue:
    name: "Route Platform and Site Issues"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Required to read .github/reviewers.json on default branch
      issues: write # Required to assign maintainers to platform/site bug and task issues
    steps:
      - name: "Assign maintainer based on issue scope"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) {
              return;
            }

            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || "main";
            let platformOwners = [];
            try {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: ".github/reviewers.json",
                ref: defaultBranch
              });
              const cfg = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
              const route = (cfg.routes || []).find(r => r.name === "site_and_platform_adapters");
              const maintainerSet = new Set((cfg.egm_maintainers || []).map(l => l.toLowerCase()));
              platformOwners = (route?.reviewers || []).filter(
                l => maintainerSet.size === 0 || maintainerSet.has(String(l).toLowerCase())
              );
            } catch (error) {
              core.warning(`Could not load .github/reviewers.json: ${error.message}`);
            }

            if (platformOwners.length === 0) {
              return;
            }

            const author = String(issue.user?.login || "").toLowerCase();
            const stripComments = text => String(text || "").replace(/<!--[\s\S]*?-->/g, "");
            const cleanText = `${stripComments(issue.title)}\n${stripComments(issue.body)}`;
            const labels = new Set((issue.labels || []).map(l => String(l.name || "").toLowerCase()));

            const isPlatformOrSite =
              /\begm\.dev\b/i.test(cleanText) ||
              /\b(?:site\/|ai\s+platform\s+adapter|platform\s+adapter|new\s+(?:ai\s+)?(?:platform\s+)?adapter|harness\s+adapter|platform\s+handle)\b/i.test(cleanText) ||
              /\b(?:claude|codex|copilot|cursor|gemini|windsurf|opencode)\b[\s\S]{0,40}\b(?:adapter|handle|plugin|extension)\b/i.test(cleanText) ||
              labels.has("site") ||
              labels.has("adapters") ||
              labels.has("platform");

            const currentAssignees = (issue.assignees || []).map(a => a.login);
            const platformSet = new Set(platformOwners.map(login => login.toLowerCase()));

            if (!platformSet.has(author) && isPlatformOrSite && currentAssignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issue.number,
                assignees: platformOwners
              });
            }
