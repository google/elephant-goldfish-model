name: OpenCode native probe

on:
  pull_request:
    paths:
      - '.github/workflows/opencode-native.yml'
      - 'adapters/opencode/**'
      - 'agents/**'
      - 'docs/opencode.md'
      - 'resources/**'
      - 'skills/**'
      - 'plugin.json'
      - 'tests/integration/opencode-ci/**'
      - 'tests/integration/opencode_native_probe.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencode-native.yml'
      - 'adapters/opencode/**'
      - 'agents/**'
      - 'docs/opencode.md'
      - 'resources/**'
      - 'skills/**'
      - 'plugin.json'
      - 'tests/integration/opencode-ci/**'
      - 'tests/integration/opencode_native_probe.py'

permissions:
  contents: read

jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned OpenCode executable
        working-directory: tests/integration/opencode-ci
        run: npm ci --ignore-scripts
      - name: Exercise native child permissions
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/opencode-native-probe
        run: >-
          python tests/integration/opencode_native_probe.py
          --source .
          --opencode tests/integration/opencode-ci/node_modules/opencode-linux-x64/bin/opencode
          --output "$PROBE_OUTPUT"
