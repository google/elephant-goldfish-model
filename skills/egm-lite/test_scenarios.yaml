skill: "egm-lite"
description: "Behavioral evaluation scenario suite for egm-lite skill."

scenarios:
  - scenario_id: "critique_pause_gating"
    description: "Verifies agent pauses for checklist command before executing mutating operations."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "/egm-lite Can we add a quick retry loop with a 5s delay inside our network request handler to handle timeouts?"
        assertions:
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:"
            message: "Critique pause response must open with a > **BLUF:** blockquote."
          - type: "required_pattern"
            pattern: "\\n---\\n"
            message: >-
              BLUF blockquote must be terminated by a --- horizontal rule.
          - type: "required_pattern"
            pattern: "checklist"
            message: "Agent must instruct user to type checklist so automatic spec review runs before coding."
          - type: "forbidden_pattern"
            pattern: "```java\\npublic class"
            message: "Agent must not implement full code during critique pause."
          - type: "forbidden_pattern"
            pattern: "egm_lite_alternatives\\.md"
            message: >-
              Agent must omit egm_lite_alternatives.md for single-path tasks.

  - scenario_id: "checklist_and_automatic_spec_review"
    description: >-
      Verifies commanding checklist generates egm_lite_checklist.md and
      automatically dispatches a fresh-context Goldfish Specification Reviewer
      subagent in the same turn before implementation.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "Using Section 2 of EGM-Lite, here is my command: checklist. Describe the exact steps you execute in this turn."
        assertions:
          - type: "required_pattern"
            pattern: "egm_lite_checklist\\.md"
            message: "Agent must generate or update egm_lite_checklist.md."
          - type: "required_pattern"
            pattern: "(- \\[ \\]|task list|checkbox)"
            message: "Agent must format checklist items as GFM task list checkboxes."
          - type: "required_pattern"
            pattern: "(clickable|link|\\[[^\\]]+\\]\\([^\\)]+\\))"
            message: >-
              Agent must format checklist file targets and references as
              clickable links.
          - type: "required_pattern"
            pattern: "Goldfish Specification Reviewer"
            message: >-
              Section 2 must automatically dispatch a fresh-context Goldfish
              Specification Reviewer subagent in the same turn.
          - type: "required_pattern"
            pattern: "(Scope Containment|Contract|Failure Modes|Test Plan)"
            message: >-
              Section 2B must evaluate the checklist against the Specification
              Review Rubric.
          - type: "forbidden_pattern"
            pattern: "(run git diff|gather git diff|inspect git diff)"
            message: >-
              Section 2B pre-implementation spec review must forbid git diff
              implementation checks.

  - scenario_id: "spec_review_lgtm_gates_on_exec"
    description: >-
      Verifies pre-implementation spec review [✅ LGTM] in Section 5 stamps
      Verified [✅ LGTM] and prompts for exec/Proceed without prematurely
      closing the task.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          The Goldfish Specification Reviewer subagent completed its pre-implementation
          audit of egm_lite_checklist.md and returned an explicit [✅ LGTM] with
          zero findings. How do you handle this response under Section 5?
        assertions:
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:"
            message: "Spec LGTM response must open with a > **BLUF:** blockquote."
          - type: "required_pattern"
            pattern: "\\[✅\\s*LGTM\\]"
            message: "Spec LGTM BLUF must lead with the [✅ LGTM] badge."
          - type: "required_pattern"
            pattern: "(exec|Proceed)"
            message: >-
              Spec LGTM response must prompt the user to click Proceed or type
              exec to begin implementation.
          - type: "forbidden_pattern"
            pattern: "(modified files|passing test targets|completed the task)"
            message: >-
              Pre-implementation spec LGTM must not close out the task or emit
              post-implementation completion summaries.

  - scenario_id: "spec_review_findings_triage"
    description: >-
      Verifies pre-implementation spec review findings in Section 5 perform
      presentation-only [X] [PY] triage with zero file mutations.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          The Goldfish Specification Reviewer subagent returned findings on
          egm_lite_checklist.md: missing timeout budget and unverified retry
          contract. How do you triage this under Section 5?
        assertions:
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:"
            message: "Spec triage response must open with a > **BLUF:** blockquote."
          - type: "required_pattern"
            pattern: "\\[🛠️\\s*\\d+\\s*FIX\\s*\\|\\s*🛡️\\s*\\d+\\s*CONTEST\\]"
            message: "Spec triage BLUF must lead with [🛠️ X FIX | 🛡️ Y CONTEST] badge."
          - type: "required_pattern"
            pattern: "\\[\\d+\\]\\s*\\[P[0-3]\\]"
            message: "Spec triage must tag items with [X] [PY] priority format."
          - type: "required_pattern"
            pattern: "(checklist|exec|goldfish|review)"
            message: >-
              Spec triage completion gate must offer checklist/review/goldfish
              re-audit or exec once aligned.
          - type: "forbidden_pattern"
            pattern: "(edit_file|write_file|replace_file_content|write_to_file)"
            message: "Spec triage turn must remain presentation-only without tool mutations."

  - scenario_id: "state_advisory_blocks_premature_exec_and_diff_review"
    description: >-
      Verifies commanding exec or review directly after Section 1 Critique Pause
      emits a [State Advisory] blockquote directing the user to checklist first.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          We just finished Section 1 Critique Pause on RequestHandler and have
          not generated or reviewed egm_lite_checklist.md yet. Command: exec.
          How do you respond?
        assertions:
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:.*State Advisory"
            message: >-
              Premature exec before checklist and spec review must emit a
              > **BLUF:** [State Advisory] blockquote.
          - type: "required_pattern"
            pattern: "\\n---\\n"
            message: "State advisory BLUF must be terminated by a --- horizontal rule."
          - type: "required_pattern"
            pattern: "checklist"
            message: "State advisory must recommend checklist as the valid next command."

  - scenario_id: "goldfish_adversarial_review"
    description: "Asserts adversarial critique is applied without flattering adjectives."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "Using EGM-Lite, review this diff adding retry loops without exponential backoff or jitter."
        assertions:
          - type: "forbidden_pattern"
            pattern: "(brilliant|great idea|perfect|excellent|smart)"
            message: "Adversarial critique must not contain flattering adjectives."
          - type: "forbidden_pattern"
            pattern: "(\\[✅\\s*LGTM\\]|\\bLGTM\\b)"
            message: >-
              Adversarial review reporting defects must strictly omit LGTM.
          - type: "required_pattern"
            pattern: "(backoff|jitter|stampede|thundering)"
            message: "Critique must flag missing backoff or thundering herd risks."

  - scenario_id: "external_contract_verification"
    description: "Verifies public interfaces and contracts are checked."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "We want to rely on enable_fast_path=true in RpcClientConfig. Can you verify this parameter?"
        assertions:
          - type: "required_pattern"
            pattern: "(UNVERIFIED|contract|verification|evidence)"
            message: "Agent must flag unverified assumptions or specify contract verification strategy."

  - scenario_id: "post_review_synchronization_and_gate"
    description: "Verifies post-implementation diff review findings synchronization."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "The Goldfish Code Reviewer completed its post-implementation diff review on RequestHandler and found missing null checks and unaddressed risk. What should we do?"
        assertions:
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:"
            message: "Resolution response must open with a > **BLUF:** blockquote."
          - type: "required_pattern"
            pattern: "\\[🛠️\\s*\\d+\\s*FIX\\s*\\|\\s*🛡️\\s*\\d+\\s*CONTEST\\]"
            message: >-
              Resolution BLUF must lead with the [🛠️ X FIX | 🛡️ Y CONTEST]
              status badge.
          - type: "required_pattern"
            pattern: "\\n---\\n"
            message: >-
              BLUF blockquote must be terminated by a --- horizontal rule.
          - type: "required_pattern"
            pattern: "(findings|agree|checklist)"
            message: "Agent must summarize findings and ask user which ones to incorporate into the checklist."
          - type: "required_pattern"
            pattern: "(PROPOSE FIX|CONTEST)"
            message: "Agent must triage post-review findings into PROPOSE FIX vs. CONTEST."
          - type: "required_pattern"
            pattern: "\\[\\d+\\]\\s*\\[P[0-3]\\]"
            message: "Agent must tag findings with sequential index and priority tiers [X] [PY]."
          - type: "forbidden_pattern"
            pattern: "(edit_file|write_file|replace_file_content|write_to_file)"
            message: >-
              Triage turn must remain presentation-only without tool mutations.

  - scenario_id: "post_review_lgtm_completion"
    description: >-
      Verifies clean post-implementation Goldfish Code Reviewer passes open with
      a > **BLUF:** led by [✅ LGTM] and summarize completed files and tests.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          After Section 3 modified RequestHandler, the Goldfish Code Reviewer
          subagent completed its optional diff re-review and returned an
          explicit [✅ LGTM] with zero flaws. How do you handle this response
          under Section 5?
        assertions:
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:"
            message: "Clean LGTM response must open with a > **BLUF:** blockquote."
          - type: "required_pattern"
            pattern: "\\[✅\\s*LGTM\\]"
            message: "Clean LGTM BLUF must lead with the [✅ LGTM] status badge."
          - type: "required_pattern"
            pattern: "\\n---\\n"
            message: >-
              BLUF blockquote must be terminated by a --- horizontal rule.

  - scenario_id: "post_review_checklist_update"
    description: >-
      Asserts commanding checklist after triage updates egm_lite_checklist.md
      with agreed items and CONTEST rationales and triggers automatic spec
      re-review.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "Following Section 5 triage, we agreed to add null check and RPC verification to the checklist, and contest the thread-safety false positive. Command: checklist."
        assertions:
          - type: "required_pattern"
            pattern: "(null|RPC|checklist)"
            message: "Agent must update checklist with agreed items."
          - type: "required_pattern"
            pattern: "(CONTEST|thread-safety|false positive)"
            message: "Agent must record accepted CONTEST rationales in the checklist."
          - type: "required_pattern"
            pattern: "Goldfish Specification Reviewer"
            message: "Section 2 must automatically re-run Goldfish Specification Reviewer on the updated checklist."

  - scenario_id: "exec_protocol_adherence_and_optional_rereview"
    description: >-
      Verifies Section 3 records the review baseline, executes approved
      checklist items, marks - [x], and treats post-implementation diff
      re-review as optional.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "egm_lite_checklist.md is stamped Verified [✅ LGTM] for RequestHandler. Command: exec. Describe your exact steps and completion gate."
        assertions:
          - type: "required_pattern"
            pattern: "(baseline|starting commit)"
            message: "Section 3 must record the review baseline before making the first implementation edit."
          - type: "required_pattern"
            pattern: "(- \\[x\\]|egm_lite_checklist\\.md)"
            message: "Agent must mark completed checklist tasks with - [x]."
          - type: "required_pattern"
            pattern: "optional"
            message: "Section 3 completion gate must present post-implementation diff re-review as optional."
          - type: "required_pattern"
            pattern: "(review|goldfish)"
            message: "Section 3 completion gate must mention review or goldfish as the optional re-review command."

  - scenario_id: "exec_from_triage_updates_checklist_before_coding"
    description: >-
      Verifies commanding exec after Section 5 triage updates
      egm_lite_checklist.md with agreed fixes and CONTEST rationales before
      editing repository files.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          Following Section 5 triage on RequestHandler, we aligned on applying
          the null-check fix and contesting the naming nit, and want to proceed
          straight to implementation. Command: exec. Describe your exact steps.
        assertions:
          - type: "required_pattern"
            pattern: "egm_lite_checklist\\.md"
            message: "Exec from Section 5 triage must update egm_lite_checklist.md before editing target files."
          - type: "required_pattern"
            pattern: "CONTEST"
            message: "Exec from Section 5 triage must persist accepted CONTEST rationales in egm_lite_checklist.md."
          - type: "required_pattern"
            pattern: "- \\[x\\]"
            message: "Exec must mark completed checklist items with - [x] after test verification."

  - scenario_id: "optional_diff_review_baseline_and_untracked_files"
    description: >-
      Verifies Section 4 optional diff re-review collects committed task
      changes, unstaged edits, and untracked files against the recorded
      baseline, excludes pre-existing unrelated edits, and stops on missing
      baseline or uninspectable targets.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          After Section 3 completed, I ran: review. The task added a new
          untracked helper file, committed one fix mid-task, and the working
          tree also had unrelated pre-existing edits in another file. How does
          Section 4 collect the review input, and what if the baseline is
          missing or a checklist target cannot be inspected?
        assertions:
          - type: "required_pattern"
            pattern: "(git ls-files --others --exclude-standard|untracked)"
            message: "Section 4 must include new untracked task files in the review input."
          - type: "required_pattern"
            pattern: "(starting-commit|baseline|committed)"
            message: "Section 4 must diff against the recorded starting baseline so committed task changes are included."
          - type: "required_pattern"
            pattern: "(unrelated|pre-existing|separate|exclud)"
            message: "Section 4 must keep unrelated pre-existing edits out of the task's review input."
          - type: "required_pattern"
            pattern: "(incomplete coverage|stop)"
            message: "Section 4 must stop and report incomplete coverage if the baseline is missing or a target cannot be inspected."

  - scenario_id: "code_references_and_navigation_links"
    description: "Asserts clickable links and navigation hygiene."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: "Review diff on RequestHandler touching src/RequestHandler.java."
        assertions:
          - type: "required_pattern"
            pattern: "\\[[^\\]]+\\]\\([^\\)]+\\)"
            message: "Local references must use clickable markdown links."

  - scenario_id: "fresh_context_delegation_guard"
    description: >-
      Verifies both Section 2B and Section 4 require a fresh-context subagent
      tool and never simulate a same-context Goldfish review when unavailable.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          Note that this harness does not expose any subagent tool (no
          invoke_subagent, Agent, or spawn_agent). 1) How do you proceed at
          Section 2B after writing egm_lite_checklist.md? 2) How do you proceed
          if the user commands goldfish at Section 4?
        assertions:
          - type: "required_pattern"
            pattern: "(not a Goldfish review|same-context|never.*simulate)"
            message: >-
              Agent must refuse same-context Goldfish reviews in both Section 2B
              and Section 4 when no subagent tool is available.
          - type: "required_pattern"
            pattern: "(Proceed|exec)"
            message: >-
              Section 2B must fall back to explicit human approval (Proceed or
              exec) on egm_lite_checklist.md when no subagent tool exists.

  - scenario_id: "pre_review_exclusion_and_materiality_floor"
    description: >-
      Verifies Section 2 persists pre-review exclusions in egm_lite_checklist.md
      and both Section 2B and Section 4 instruct the Goldfish subagent to skip
      pre-review exclusions and stylistic nitpicks.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          During Phase 1 we agreed to exclude legacy metric migration from scope
          for RequestHandler. How do you record this in Section 2 (checklist)
          and how do Section 2B and Section 4 prevent the Goldfish subagent from
          re-flagging it or raising stylistic nitpicks?
        assertions:
          - type: "required_pattern"
            pattern: "egm_lite_checklist\\.md"
            message: >-
              Agent must record pre-review exclusions in egm_lite_checklist.md.
          - type: "required_pattern"
            pattern: "(pre-review exclusion|exclude|skip)"
            message: >-
              Goldfish subagent prompts must skip pre-review exclusions recorded
              in the checklist.
          - type: "required_pattern"
            pattern: "(material|nitpick|stylistic)"
            message: >-
              Goldfish subagent prompts must restrict findings to material
              issues and suppress stylistic nitpicks.

  - scenario_id: "readme_grounding_and_inline_checklist_comments"
    description: >-
      Verifies Section 1 grounds in target files, direct callers or tests, and
      any existing directory README.md or user-cited doc, and Section 3 applies
      inline comments left on egm_lite_checklist.md.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          1) Under Section 1, which local files and documentation must you read
          during grounding? 2) Under Section 3, if the user leaves an inline
          comment on egm_lite_checklist.md when approving, how do you handle it?
        assertions:
          - type: "required_pattern"
            pattern: "(caller|test)"
            message: >-
              Section 1 grounding must include direct callers or tests of target
              files.
          - type: "required_pattern"
            pattern: "README\\.md"
            message: >-
              Section 1 grounding must include any existing directory README.md
              or user-cited doc.
          - type: "required_pattern"
            pattern: "(inline|comment|adjustment)"
            message: >-
              Section 3 must apply inline comments on egm_lite_checklist.md
              before implementing.

  - scenario_id: "exec_conditional_bluf_escalation_and_multifile"
    description: >-
      Verifies Section 3 leads with a > **BLUF:** on escalation halts,
      autonomous self-repairs, or multi-file changes while omitting it on clean
      single-target runs.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          Under Section 3 (EXEC PROTOCOL), when must your output lead with a
          > **BLUF:** blockquote and when must you omit it?
        assertions:
          - type: "required_pattern"
            pattern: "(Escalation|multi-file|self-repair)"
            message: >-
              Section 3 must require a > **BLUF:** on escalation halts,
              multi-file changes, or autonomous self-repairs.
          - type: "required_pattern"
            pattern: "(single-target|omit)"
            message: >-
              Section 3 must omit > **BLUF:** on clean single-target runs.

  - scenario_id: "alternatives_considered_artifact"
    description: >-
      Verifies multiple viable approaches are documented in
      egm_lite_alternatives.md during Critique Pause.
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-lite/SKILL.md"
    turns:
      - user_input: >-
          /egm-lite We can either add a local in-memory LRU cache or query
          database read-only replicas to fix the lookup latency in
          RequestHandler. Which approach should we take and how do you document
          the alternatives?
        assertions:
          - type: "required_pattern"
            pattern: "egm_lite_alternatives\\.md"
            message: >-
              Agent must document competing approaches in
              egm_lite_alternatives.md.
          - type: "required_pattern"
            pattern: ">\\s*\\*\\*BLUF(?:\\*\\*)?:"
            message: >-
              Critique pause and alternatives artifact must use a > **BLUF:**
              blockquote.
          - type: "required_pattern"
            pattern: "\\n---\\n"
            message: >-
              BLUF blockquote must be terminated by a --- horizontal rule.
          - type: "required_pattern"
            pattern: "(without.*inline|not.*inline|link.*artifact)"
            message: >-
              Agent must link egm_lite_alternatives.md in chat without
              discussing alternatives inline.
          - type: "required_pattern"
            pattern: "checklist"
            message: >-
              Agent must gate on checklist at the end of the Critique Pause.
