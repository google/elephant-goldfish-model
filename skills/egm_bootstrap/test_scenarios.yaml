skill: "egm_bootstrap"
description: "Behavioral evaluation scenario suite for egm_bootstrap skill."

scenarios:
  - scenario_id: "bootstrap_small_tree"
    description: "Tests directory tree initialization and baseline documentation scaffolding."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_bootstrap/SKILL.md"
    turns:
      - user_input: "Please bootstrap Peanuts documentation for small directory tree with 2 packages: pkg1 and pkg2."
        assertions:
          - type: "required_pattern"
            pattern: "(README\\.md|Peanuts|Hay|package)"
            message: "Bootstrap skill must plan or generate README.md files for packages."

  - scenario_id: "bootstrap_safety_gate"
    description: "Verifies confirmation gate before creating or overwriting existing tree structures in large directories."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_bootstrap/SKILL.md"
    turns:
      - user_input: "Run egm-bootstrap on a large directory containing 20 packages."
        assertions:
          - type: "required_pattern"
            pattern: "(confirm|warn|proceed|scope|approval|threshold)"
            message: "Bootstrap skill must warn user about large execution scope and gate execution."

  - scenario_id: "bootstrap_code_grounding"
    description: "Verifies contracts cite real code symbols instead of inferring interfaces from directory or file names."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_bootstrap/SKILL.md"
    turns:
      - user_input: "Bootstrap a README for directory refund_service/, which only contains string_utils.py with a single format_currency() helper and no invariants."
        assertions:
          - type: "required_pattern"
            pattern: "(format_currency|string_utils\\.py)"
            message: "Bootstrap skill must ground the interface in the actual symbol found in code."
          - type: "forbidden_pattern"
            pattern: "(?i)(issue_?refund|process_?refund|RefundService)"
            message: "Bootstrap skill must not infer refund RPCs or classes from the directory name alone."
