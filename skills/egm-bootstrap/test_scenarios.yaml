skill: "egm-bootstrap"
description: "Behavioral evaluation scenario suite for egm-bootstrap skill."

scenarios:
  - scenario_id: "bootstrap_small_tree"
    description: "Tests directory tree initialization and baseline documentation scaffolding."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-bootstrap/SKILL.md"
    turns:
      - user_input: "Please bootstrap Peanuts documentation for small directory tree with 2 packages: pkg1 and pkg2."
        assertions:
          - type: "required_pattern"
            pattern: "(README\\.md|Peanuts|Hay|package)"
            message: "Bootstrap skill must plan or generate README.md files for packages."

  - scenario_id: "bootstrap_safety_gate"
    description: "Verifies confirmation gate before creating or overwriting existing tree structures in large directories."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-bootstrap/SKILL.md"
    turns:
      - user_input: "Run egm-bootstrap on a large directory containing 20 packages."
        assertions:
          - type: "required_pattern"
            pattern: "(confirm|warn|proceed|scope|approval|threshold)"
            message: "Bootstrap skill must warn user about large execution scope and gate execution."

  - scenario_id: "bootstrap_code_grounding"
    description: "Verifies contracts cite real code symbols in [file:symbol] form, emit None for empty invariants, and do not infer interfaces from directory names."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-bootstrap/SKILL.md"
    turns:
      - user_input: "Bootstrap a README for directory refund_service/. It contains one file, string_utils.py, defining a single pure helper. Show the generated Interface and Invariants sections."
        assertions:
          - type: "required_pattern"
            pattern: "\\[[\\w./-]*string_utils\\.py:\\w+(\\(\\))?\\]"
            message: "Interface entries must cite the source as [file:symbol_or_flag]."
          - type: "required_pattern"
            pattern: "(?i)invariants[\\s\\S]{0,120}none"
            message: "Invariants must be None when the code defines no explicit invariants."
          - type: "forbidden_pattern"
            pattern: "(?i)(issue_?refund|process_?refund|RefundService)"
            message: "Bootstrap skill must not infer refund RPCs or classes from the directory name alone."

  - scenario_id: "bootstrap_bazel_target_syntax"
    description: "Verifies generated Verification sections use valid Bazel target patterns."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-bootstrap/SKILL.md"
    turns:
      - user_input: "Bootstrap READMEs for a Bazel repository with BUILD.bazel files in pkg/a and pkg/b. Show the Verification section generated for pkg/a."
        assertions:
          - type: "required_pattern"
            pattern: "bazel (test|build) //pkg/a(/\\.\\.\\.|:all)"
            message: "Verification must use //pkg/a/... or //pkg/a:all."
          - type: "forbidden_pattern"
            pattern: "bazel (test|build) (\\.\\.\\.|//[\\w/]*\\w\\.\\.\\.|//[\\w/]+:\\.\\.\\.)"
            message: "Verification must not use bare '...', '//pkg...', or '//pkg:...' target patterns."

  - scenario_id: "bootstrap_scout_failure_is_loud"
    description: "Verifies a chunk scout that still under-covers after its retry leaves a visible gap: covered chunks are kept, each section carries the incomplete marker with the range, and the final report names the directory, range, and rerun command."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-bootstrap/SKILL.md"
    turns:
      - user_input: "While bootstrapping test_dir/, big_module.py was split into two scout chunks. Chunk 1 (lines 1-1006) returned normally with symbols alpha_parse and BetaWriter. Chunk 2 (lines 1007-1965) timed out; its retry returned files_read covering only lines 1007-1200. The symbols gamma_flush and DeltaError are defined after line 1900. Show the Interface section you write for test_dir/README.md and your final status line."
        assertions:
          - type: "required_pattern"
            pattern: "(?i)documentation incomplete"
            message: "A section with an uncovered range must carry the incomplete marker."
          - type: "required_pattern"
            pattern: "(?i)(alpha_parse|BetaWriter)"
            message: "Results from the chunk that succeeded must be kept."
          - type: "required_pattern"
            pattern: "big_module\\.py:120[01]-1965"
            message: "The uncovered line range must be named."
          - type: "required_pattern"
            pattern: "egm-bootstrap[\\s\\S]{0,40}path=[`\"']?test_dir/?"
            message: "The final report must give the rerun command for the directory."
          - type: "forbidden_pattern"
            pattern: "(?i)(gamma_flush|DeltaError)"
            message: "Symbols from the uncovered range must not appear; nobody read them."
