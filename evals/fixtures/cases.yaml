schema_version: 1
dataset: egm-original-fixtures
cases:
  - id: public-api-preserved
    title: Refactor internal helper while preserving public CLI flags
    workflow: egm-review
    category: sound_plan
    showcase: false
    expected_decision: proceed
    expected_blockers: []
    allow_unsupported_blockers: false
    expected_owner_questions: []
    expected_stage: Stage 9
    expected_evidence:
      - tests/unit/test_packaging.py
      - public CLI flags unchanged
    plan: |
      # Design: Extract Archive Path Helper

      ## Goal
      Extract archive path normalization in `scripts/pack_plugin.py` into a
      private helper `_normalize_archive_path` without changing any public CLI
      flags (`--target`, `--output`), archive layout, or zip entry names.

      ## Detailed Implementation Plan
      1. Extract `_normalize_archive_path` in `scripts/pack_plugin.py`.
      2. Keep `build(root, target, output)` signature and CLI flags unchanged.
      3. Run `python -m pytest tests/unit/test_packaging.py`.

      ## Evidence
      - `scripts/pack_plugin.py` defines `build(root, target, output)`.
      - `tests/unit/test_packaging.py` verifies deterministic ZIP output and
        public CLI behavior; public CLI flags unchanged.

  - id: new-dependency-added
    title: Add unapproved runtime dependency without lockfile or offline CI update
    workflow: egm-review
    category: flawed_plan
    showcase: false
    expected_decision: hold
    expected_blockers:
      - unapproved-runtime-dependency
    allow_unsupported_blockers: false
    expected_owner_questions: []
    expected_stage: Stage 9
    expected_evidence:
      - pyproject.toml
      - requests
    plan: |
      # Design: Fetch Remote Config at Runtime

      ## Goal
      Fetch remote configuration during offline unit packaging.

      ## Detailed Implementation Plan
      1. Import `requests` in `scripts/pack_plugin.py` to fetch remote defaults
         during `build()`.
      2. Leave `pyproject.toml` dependency groups unchanged.

      ## Evidence
      - `pyproject.toml` lists only `pytest`, `pyyaml`, and `ruff` for offline
        unit and lint jobs; `requests` is not declared and requires network
        access unavailable in offline fork CI.

